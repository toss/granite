name: Setup Node & Yarn
description: Setup Node & Yarn

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # `yarn build:all` runs a Gradle 8.14 wrapper, which cannot run on JDK 25
    # (the default JDK on ubuntu-26.04 runners).
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Yarn
      run: corepack enable
      shell: bash

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
