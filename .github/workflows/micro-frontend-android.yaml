name: Micro-frontend Android contracts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/micro-frontend/android/**'
      - 'packages/micro-frontend/examples/portal/android/gradle/wrapper/**'
      - '.github/workflows/micro-frontend-android.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-contracts:
    name: Android session and event payload contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test native sessions, Activity bindings, and serialized events
        run: packages/micro-frontend/examples/portal/android/gradlew -p packages/micro-frontend/android/session-contract-tests testDebugUnitTest --console=plain
