name: Native lifecycle contracts

on:
  pull_request:
    paths:
      - 'packages/granite-screen/android/**'
      - 'packages/video/ios/**'
      - 'packages/video/native-tests/**'
      - 'packages/video/GraniteVideo.podspec'
      - '.github/workflows/native-lifecycle.yaml'

permissions:
  contents: read

jobs:
  android:
    name: Android lifecycle (RN ${{ matrix.react-native }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        react-native: ['0.84.0', '0.86.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: packages/granite-screen/android/test-lifecycle.sh -PreactNativeVersion=${{ matrix.react-native }} --console=plain
  cpp:
    name: Bundle file and evaluation errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packages/granite-screen/android/test-cpp.sh
  ios:
    name: iOS video (default provider ${{ matrix.default-provider }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        default-provider: ['true', 'false']
    env:
      GRANITE_VIDEO_DEFAULT_PROVIDER: ${{ matrix.default-provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.17.0 --no-document
      - name: Run Fabric provider tests
        shell: bash
        run: |
          export IOS_TEST_DESTINATION="$(xcrun simctl list devices available --json | ruby -rjson -e 'device = JSON.parse(STDIN.read).fetch("devices").values.flatten.find { |d| d.fetch("name").start_with?("iPhone") }; abort "No iPhone simulator" unless device; puts "platform=iOS Simulator,id=#{device.fetch("udid")}"')"
          packages/video/native-tests/test-ios.sh
